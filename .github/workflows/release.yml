name: release

# Builds sop for macOS, Linux and Windows (amd64 and arm64) and attaches the archives to a
# draft GitHub Release. Triggered by pushing a tag like v0.0.5 (it must match Cargo.toml).
#
# Asset names carry no version (sop_<os>_<arch>.tar.gz, .zip on Windows) so install.sh can
# use GitHub's releases/latest/download/<name> URL; checksums.txt lists "<sha256>  <name>".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: darwin, arch: amd64, target: x86_64-apple-darwin, runner: macos-latest }
          - { os: darwin, arch: arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { os: linux, arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { os: linux, arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { os: windows, arch: amd64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { os: windows, arch: arm64, target: aarch64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Archive
        shell: bash
        run: |
          name="sop_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p staging dist
          cp LICENSE README.md FORMAT.md staging/
          if [ "${{ matrix.os }}" = windows ]; then
            cp "target/${{ matrix.target }}/release/sop.exe" staging/
            (cd staging && 7z a -tzip "../dist/$name.zip" sop.exe LICENSE README.md FORMAT.md >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/sop" staging/
            tar -czf "dist/$name.tar.gz" -C staging sop LICENSE README.md FORMAT.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sop_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum sop_* > checksums.txt && cat checksums.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # Review the notes and assets, then publish by hand.
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag $prerelease dist/*
