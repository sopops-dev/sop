# yaml-language-server: $schema=../../../spec/config.schema.json
#
# sop.yaml marks the root of a sop folder. Every field is optional.

version: 1

# Default values for {{placeholders}}. An agent's own `variables` override these.
variables:
  staff_transfer: the manager on duty

# Named, ordered sets of blocks. An agent lists a group in `blocks` like a block,
# and it expands in place. Groups can include other groups.
groups:
  delivery-orders:              # restaurants that deliver
    - allergen-check
    - delivery-handling

# Heading placed above the first SOP in every prompt.
sops_heading: "## Procedures"
