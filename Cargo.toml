[package]
name = "sop-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "The SOP compiler: modular, git-versioned instructions for teams managing multiple task-driven agents"
license = "Apache-2.0"
repository = "https://github.com/sopops-dev/sop"
include = ["src/**", "FORMAT.md", "skills/**", "README.md", "LICENSE"]

[[bin]]
name = "sop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde_yaml_ng = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
